<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenangan Kita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c2140;--bg2:#262d57;--paper:#fbf8f3;--ink:#2b2a33;--muted:#aab0d6;--accent:#ff8fa3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));background-attachment:fixed;color:#fff;font-family:"DM Sans",system-ui,sans-serif;line-height:1.6;min-height:100vh}
header{text-align:center;padding:64px 20px 28px}
h1{font-family:"Caveat",cursive;font-weight:700;font-size:clamp(3rem,10vw,5.5rem);margin:0;line-height:1.05}
.names{font-family:"Caveat",cursive;font-size:1.8rem;color:var(--accent);margin:8px 0 0}
.counter{margin:24px auto 0;display:inline-flex;gap:28px;padding:12px 28px;border:1.5px dashed var(--muted);border-radius:999px}
.counter div{text-align:center}.counter b{display:block;font-size:1.7rem;font-weight:500}.counter span{font-size:.85rem;color:var(--muted)}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 20px 0}
.btn{font:inherit;color:#fff;background:transparent;border:1.5px solid var(--muted);padding:6px 16px;border-radius:999px;cursor:pointer}
.btn[aria-pressed="true"],.btn.pri{background:var(--accent);border-color:var(--accent);color:#2b1220}
.btn.danger{border-color:#ff6b6b;color:#ff9b9b}
.btn:focus-visible,.polaroid:focus-visible,.lb button:focus-visible,.ed button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.owner{background:rgba(255,255,255,.08);padding:10px;margin:18px auto 0;max-width:640px;border-radius:14px;display:none}
.owner.on{display:flex}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:36px 28px}
.item{position:relative}
.polaroid{width:100%;background:var(--paper);color:var(--ink);padding:12px 12px 14px;border:0;text-align:center;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.35);transform:rotate(var(--r,0deg));transition:transform .2s;font:inherit}
.polaroid:hover{transform:rotate(0) scale(1.03)}
.polaroid .img{aspect-ratio:1/1;background:#ddd;overflow:hidden;display:block}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-family:"Caveat",cursive;font-size:2.4rem;color:#fff;width:100%;height:100%;min-height:200px;display:grid;place-items:center}
.cap{font-family:"Caveat",cursive;font-size:1.5rem;line-height:1.2;margin-top:10px;display:block}
.date{font-size:.8rem;color:#777;display:block}
.ed{position:absolute;top:-10px;right:-8px;display:none;gap:6px}
.owner-on .ed{display:flex}
.ed button{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:#fff;color:#222;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:0 20px 48px;font-size:.9rem}
footer .btn{margin-top:14px;font-size:.85rem;padding:4px 14px}
.lb{position:fixed;inset:0;background:rgba(10,12,28,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;z-index:10}
.lb.open{display:flex}
.lb img{max-width:min(92vw,900px);max-height:72vh;border:10px solid var(--paper)}
.lb .ph{width:min(80vw,500px);height:min(60vh,500px);border:10px solid var(--paper)}
.lb p{font-family:"Caveat",cursive;font-size:1.9rem;margin:14px 0 0;text-align:center}
.lb small{color:var(--muted)}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;font-size:1.6rem;width:48px;height:48px;border-radius:50%;cursor:pointer}
.lb .x{top:16px;right:16px}.lb .p{left:12px;top:50%}.lb .n{right:12px;top:50%}
dialog{border:0;border-radius:16px;padding:22px;width:min(92vw,420px);background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(10,12,28,.7)}
dialog h2{margin:0 0 12px;font-size:1.2rem}
dialog label{display:block;font-size:.85rem;margin-top:10px;color:#555}
dialog input{width:100%;font:inherit;padding:8px 10px;border:1.5px solid #ccc;border-radius:8px;margin-top:3px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
dialog .btn{color:var(--ink);border-color:#bbb}dialog .btn.pri{color:#2b1220}
dialog small{display:block;color:#777;margin-top:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#222;padding:10px 18px;border-radius:999px;display:none;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.4);max-width:90vw}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Kenangan Kita</h1>
  <p class="names" id="names"></p>
  <div class="counter" aria-label="Lama bersama">
    <div><b id="cY">0</b><span>tahun</span></div><div><b id="cM">0</b><span>bulan</span></div><div><b id="cD">0</b><span>hari</span></div>
  </div>
  <div class="row" id="tools"></div>
  <div class="owner row" id="owner">
    <button class="btn pri" id="bAdd">+ Tambah foto</button>
    <button class="btn" id="bSet">Pengaturan</button>
    <button class="btn" id="bOut">Keluar</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>
</header>
<main id="grid"></main>
<footer><div id="foot"></div><button class="btn" id="bManage">Kelola</button></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Foto">
  <button class="x" id="lbX" aria-label="Tutup">×</button>
  <button class="p" id="lbP" aria-label="Sebelumnya">‹</button>
  <button class="n" id="lbN" aria-label="Berikutnya">›</button>
  <div id="lbImg"></div><p id="lbCap"></p><small id="lbDate"></small>
</div>

<dialog id="dEdit"><form method="dialog" id="fEdit">
  <h2>Edit foto</h2>
  <label>Caption<input id="eCap" maxlength="80"></label>
  <label>Tanggal<input id="eDate" type="date" required></label>
  <label>Album<input id="eAlb" list="albums" maxlength="30"></label><datalist id="albums"></datalist>
  <div class="acts"><button type="button" class="btn danger" id="eDel">Hapus foto</button><button type="button" class="btn" data-close>Batal</button><button class="btn pri">Simpan</button></div>
</form></dialog>

<dialog id="dSet"><form method="dialog" id="fSet">
  <h2>Pengaturan</h2>
  <label>Namamu<input id="sA"></label>
  <label>Nama pacar<input id="sB"></label>
  <label>Tanggal jadian<input id="sD" type="date"></label>
  <label>Pesan di bawah<input id="sF"></label>
  <label>Repository (pemilik/nama)<input id="sR" placeholder="usernamekamu/kenangan-kita"></label>
  <label>Token GitHub<input id="sT" type="password" autocomplete="off" placeholder="github_pat_..."></label>
  <small>Token hanya disimpan di browser ini. Jangan dibagikan ke siapa pun.</small>
  <div class="acts"><button type="button" class="btn" data-close>Batal</button><button class="btn pri">Simpan</button></div>
</form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const hues = [345,220,160,30,275,195];
const fmt = d => new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
let DATA = {config:{namaKamu:"Nama Kamu",namaPacar:"Nama Dia",mulaiPacaran:"2024-02-14",pesanFooter:""},photos:[]};
const preview = {};            // foto yang baru diunggah, ditampilkan langsung sebelum GitHub selesai memproses
let shown = [], idx = 0, filter = "Semua", editing = null;
let S = {repo:"",token:""};
try { S = JSON.parse(localStorage.getItem("kenangan-s")||"") || S; } catch(e){}
if (!S.repo && location.hostname.endsWith(".github.io")) {
  S.repo = location.hostname.split(".")[0] + "/" + (location.pathname.split("/")[1] || "");
}
const ownerOn = () => document.body.classList.contains("owner-on");

function toast(t, ms){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); if(ms) toast.t=setTimeout(()=>e.classList.remove("on"),ms); }

/* ---------- GitHub API ---------- */
async function gh(path, method="GET", body){
  const r = await fetch(`https://api.github.com/repos/${S.repo}/contents/${path}${method==="GET"?"?t="+Date.now():""}`,{
    cache:"no-store", method, headers:{Authorization:"Bearer "+S.token, Accept:"application/vnd.github+json"},
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 404 && method === "GET") return null;
  if (!r.ok) { const j = await r.json().catch(()=>({})); throw new Error(r.status===401||r.status===403 ? "Token ditolak. Cek token dan izin 'Contents: Read and write'." : (j.message||("Error "+r.status))); }
  return r.json();
}
const b64 = s => btoa(unescape(encodeURIComponent(s)));
let saveQ = Promise.resolve();
function saveData(msg){
  const job = saveQ.then(async()=>{
    for(let i=0;;i++){
      try{
        const cur = await gh("data.json");
        await gh("data.json","PUT",{message:msg, content:b64(JSON.stringify(DATA,null,2)), sha:cur&&cur.sha});
        return;
      }catch(e){ if(i<3 && /does not match|conflict/i.test(e.message)){ await new Promise(r=>setTimeout(r,800)); continue; } throw e; }
    }
  });
  saveQ = job.catch(()=>{});
  return job;
}
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",.85)); };
    img.onerror=()=>rej(new Error("File bukan gambar yang valid: "+file.name)); img.src=u;
  });
}
async function run(label, fn){
  try { toast(label+"...", 0); await fn(); toast("Tersimpan ✓ (situs diperbarui dalam ±1 menit)", 4000); }
  catch(e){ toast("Gagal: "+e.message, 6000); }
}

/* ---------- Tampilan ---------- */
function applyConfig(){
  const c = DATA.config;
  $("names").textContent = c.namaKamu+" & "+c.namaPacar; $("foot").textContent = c.pesanFooter||"";
  const s=new Date(c.mulaiPacaran+"T00:00:00"), n=new Date();
  let y=n.getFullYear()-s.getFullYear(), m=n.getMonth()-s.getMonth(), d=n.getDate()-s.getDate();
  if(d<0){m--; d+=new Date(n.getFullYear(),n.getMonth(),0).getDate();} if(m<0){y--; m+=12;}
  $("cY").textContent=Math.max(y,0); $("cM").textContent=Math.max(m,0); $("cD").textContent=Math.max(d,0);
}
function media(f,i){
  const img=new Image(); img.alt=f.caption; img.loading="lazy"; img.src=preview[f.file]||f.file;
  img.onerror=()=>{ const p=document.createElement("div"); p.className="ph"; p.style.background=`hsl(${hues[i%6]} 55% 62%)`; p.textContent="♡"; img.replaceWith(p); };
  return img;
}
function renderTools(){
  const albums=["Semua",...new Set(DATA.photos.map(f=>f.album).filter(Boolean))];
  if(!albums.includes(filter)) filter="Semua";
  const t=$("tools"); t.innerHTML="";
  if(albums.length>1) albums.forEach(a=>{ const b=document.createElement("button"); b.className="btn"; b.textContent=a; b.setAttribute("aria-pressed",a===filter); b.onclick=()=>{filter=a;renderTools();render();}; t.appendChild(b); });
  $("albums").innerHTML=albums.slice(1).map(a=>`<option value="${a.replace(/"/g,"&quot;")}">`).join("");
}
function render(){
  const g=$("grid"); g.innerHTML="";
  DATA.photos.sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  shown = filter==="Semua" ? DATA.photos : DATA.photos.filter(f=>f.album===filter);
  if(!shown.length){ g.innerHTML='<p class="empty">Belum ada foto. Klik "Kelola" di bawah untuk mulai menambah.</p>'; return; }
  shown.forEach((f,i)=>{
    const w=document.createElement("div"); w.className="item";
    const b=document.createElement("button"); b.className="polaroid"; b.style.setProperty("--r",((i*37)%7-3)+"deg");
    b.setAttribute("aria-label","Buka foto: "+f.caption);
    const im=document.createElement("span"); im.className="img"; im.appendChild(media(f,i)); b.appendChild(im);
    const c=document.createElement("span"); c.className="cap"; c.textContent=f.caption||"Tanpa judul"; b.appendChild(c);
    const d=document.createElement("span"); d.className="date"; d.textContent=fmt(f.tanggal); b.appendChild(d);
    b.onclick=()=>openLb(i);
    const ed=document.createElement("div"); ed.className="ed";
    const eb=document.createElement("button"); eb.textContent="✎"; eb.setAttribute("aria-label","Edit foto"); eb.onclick=()=>openEdit(f);
    ed.appendChild(eb); w.append(b,ed); g.appendChild(w);
  });
}
function refresh(){ applyConfig(); renderTools(); render(); }

/* ---------- Lightbox ---------- */
function openLb(i){ idx=i; showLb(); $("lb").classList.add("open"); $("lbX").focus(); }
function showLb(){ const f=shown[idx]; $("lbImg").replaceChildren(media(f,idx)); $("lbCap").textContent=f.caption||""; $("lbDate").textContent=fmt(f.tanggal); }
const step=d=>{ idx=(idx+d+shown.length)%shown.length; showLb(); };
$("lbX").onclick=()=>$("lb").classList.remove("open"); $("lbP").onclick=()=>step(-1); $("lbN").onclick=()=>step(1);
$("lb").onclick=e=>{ if(e.target.id==="lb") $("lb").classList.remove("open"); };
document.addEventListener("keydown",e=>{ if(!$("lb").classList.contains("open")) return;
  if(e.key==="Escape") $("lb").classList.remove("open"); if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1); });

/* ---------- Mode kelola ---------- */
function setOwner(on){ document.body.classList.toggle("owner-on",on); $("owner").classList.toggle("on",on); $("bManage").style.display=on?"none":""; }
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());
function openSettings(){
  const c=DATA.config; $("sA").value=c.namaKamu; $("sB").value=c.namaPacar; $("sD").value=c.mulaiPacaran; $("sF").value=c.pesanFooter||"";
  $("sR").value=S.repo; $("sT").value=S.token; $("dSet").showModal();
}
$("bManage").onclick=()=>{ if(S.token&&S.repo) setOwner(true); else openSettings(); };
$("bSet").onclick=openSettings;
$("bOut").onclick=()=>{ S.token=""; localStorage.setItem("kenangan-s",JSON.stringify(S)); setOwner(false); toast("Keluar dari mode kelola.",2500); };
$("fSet").onsubmit=()=>{
  S={repo:$("sR").value.trim().replace(/^https?:\/\/github\.com\//,""), token:$("sT").value.trim()};
  localStorage.setItem("kenangan-s",JSON.stringify(S));
  DATA.config={namaKamu:$("sA").value,namaPacar:$("sB").value,mulaiPacaran:$("sD").value||DATA.config.mulaiPacaran,pesanFooter:$("sF").value};
  refresh();
  if(S.repo&&S.token){ setOwner(true); run("Menyimpan pengaturan",()=>saveData("Ubah pengaturan")); }
  else toast("Isi repository dan token untuk bisa menyimpan ke GitHub.",5000);
};

/* Tambah foto (banyak sekaligus) */
$("bAdd").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  await run(`Mengunggah ${files.length} foto`,async()=>{
    for(let i=0;i<files.length;i++){
      toast(`Mengunggah foto ${i+1} dari ${files.length}...`,0);
      const data=await compress(files[i]), name=`foto/${Date.now()}-${i}.jpg`;
      await gh(name,"PUT",{message:"Tambah foto",content:data.split(",")[1]});
      preview[name]=data;
      DATA.photos.push({file:name,caption:files[i].name.replace(/\.[^.]+$/,"").replace(/[-_]+/g," "),
        tanggal:new Date(files[i].lastModified).toISOString().slice(0,10),album:filter==="Semua"?"":filter});
      refresh();
    }
    await saveData(`Tambah ${files.length} foto`);
  });
};

/* Edit & hapus foto */
function openEdit(f){ editing=f; $("eCap").value=f.caption||""; $("eDate").value=f.tanggal; $("eAlb").value=f.album||""; $("dEdit").showModal(); }
$("fEdit").onsubmit=()=>{
  Object.assign(editing,{caption:$("eCap").value,tanggal:$("eDate").value,album:$("eAlb").value.trim()});
  refresh(); run("Menyimpan perubahan",()=>saveData("Edit foto"));
};
$("eDel").onclick=()=>{
  if(!confirm("Hapus foto ini secara permanen?")) return;
  const f=editing; $("dEdit").close();
  run("Menghapus foto",async()=>{
    const cur=await gh(f.file); if(cur) await gh(f.file,"DELETE",{message:"Hapus foto",sha:cur.sha});
    DATA.photos=DATA.photos.filter(p=>p!==f); refresh(); await saveData("Hapus foto");
  });
};

/* ---------- Mulai ---------- */
(async()=>{
  try{ const r=await fetch("data.json?"+Date.now()); if(r.ok) DATA=await r.json(); }catch(e){}
  refresh(); if(S.token&&S.repo) $("bManage").textContent="Kelola";
})();
</script>
</body>
</html>
